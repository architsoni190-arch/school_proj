<!DOCTYPE html>
<html>
<head>
    <title>Parents</title>
</head>
<body>
    <h1>Parent List</h1>
    <ul>
        {% for parent in parents %}
            <li>{{ parent.name }} (Age: {{ parent.age }})</li>
        {% empty %}
            <li>No parents found.</li>
        {% endfor %}
    </ul>
</body>
</html>
