<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>
    <h1>Student List</h1>
    <a href="{% url 'student_add' %}">Add New Student</a>
    <ul>
        {% for student in students %}
        <li>
            {{ student.name }} (Age: {{ student.age }}) - Parent: {{ student.parent.name }}
            [<a href="{% url 'student_edit' student.id %}">Edit</a>] 
            [<a href="{% url 'student_delete' student.id %}">Delete</a>]
        </li>
        {% empty %}
        <li>No students found.</li>
        {% endfor %}
    </ul>
</body>
</html>
